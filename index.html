<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React TODO Implementation (Experiments 12 & 14)</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 2rem; background: #f3f4f6; }
        .todo-app { max-width: 400px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .todo-input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        .todo-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
        .todo-item button { background: #dc2626; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Experiment 12 & 14: React Components, JSX, Props, State, Events, List Rendering
        const TodoItem = ({ todo, onDelete }) => (
            <div className="todo-item">
                <span>{todo.text}</span>
                <button onClick={() => onDelete(todo.id)}>Delete</button>
            </div>
        );

        const TodoApp = () => {
            const [todos, setTodos] = React.useState([
                { id: 1, text: 'Review Hospital Appointment System PR' },
                { id: 2, text: 'Verify GitHub Repository' }
            ]);
            const [input, setInput] = React.useState('');

            const handleAdd = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                setTodos([...todos, { id: Date.now(), text: input }]);
                setInput('');
            };

            const handleDelete = (id) => {
                setTodos(todos.filter(todo => todo.id !== id));
            };

            return (
                <div className="todo-app">
                    <h2>React Task Manager</h2>
                    <p>Supporting Experiments 12 (React) & 14 (React TODO)</p>
                    <form onSubmit={handleAdd}>
                        <input 
                            type="text" 
                            className="todo-input"
                            value={input} 
                            onChange={(e) => setInput(e.target.value)} 
                            placeholder="Add a new task..." 
                        />
                    </form>
                    <div>
                        {todos.length === 0 && <p>No tasks remaining!</p>}
                        {todos.map(todo => (
                            <TodoItem key={todo.id} todo={todo} onDelete={handleDelete} />
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TodoApp />);
    </script>
</body>
</html>
